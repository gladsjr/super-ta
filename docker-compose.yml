services:
  db:
    image: postgres:16-alpine
    container_name: superta-db
    environment:
      POSTGRES_USER: superta
      POSTGRES_PASSWORD: superta
      POSTGRES_DB: superta
    ports:
      - "5432:5432"
    volumes:
      - superta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superta -d superta"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  superta-pgdata:
