<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SuperTA — Professor</title>
<style>
  body { font-family: system-ui; margin: 2rem auto; max-width: 820px; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: 0.2rem; }
  .muted { color: #666; font-size: 0.9em; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin: 0.75rem 0; }
  .card h3 { margin: 0 0 0.3rem 0; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 0.1em 0.5em; border-radius: 10px; font-size: 0.8em; background: #f0f0f0; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #eee; font-size: 0.95em; }
  input, button { padding: 0.4rem; font-size: 1em; }
  a { color: #0366d6; word-break: break-all; }
  #notfound { color: red; }
  code.token { background: #f4f4f4; border: 1px solid #e4e4e4; padding: 0.15em 0.45em; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; word-break: break-all; }
  button.icon-btn { background: none; border: 1px solid #ddd; border-radius: 4px; padding: 0.1em 0.4em; cursor: pointer; font-size: 0.95em; line-height: 1; }
  button.icon-btn:hover { background: #f4f4f4; }
  button.icon-btn:disabled { color: #2a8f3a; border-color: #c9e5cf; background: #eefaf0; cursor: default; }
</style>
</head>
<body>

<div id="notfound" style="display:none">Trabalho não encontrado. Confira o link.</div>

<div id="main" style="display:none">
  <h1 id="work-name">—</h1>
  <div class="muted" id="meta"></div>

  <div class="card">
    <h3>Enunciado do trabalho</h3>
    <div id="enunciado-status" class="muted"></div>
    <div class="row" style="margin-top:0.5rem">
      <input type="file" id="enunciado-file" accept="application/pdf"/>
      <button id="send-enunciado">Enviar PDF</button>
    </div>
    <div id="enunciado-msg" class="muted" style="margin-top:0.4rem"></div>
  </div>

  <div class="card">
    <h3>Estilo do entrevistador</h3>
    <div id="interviewer-status" class="muted"></div>
    <div class="row" style="margin-top:0.5rem">
      <label for="tpl-select">Carregar template:</label>
      <select id="tpl-select"></select>
      <button id="load-tpl">Carregar</button>
      <button id="adapt-interviewer" title="Especializa o YAML para o enunciado deste trabalho">Adaptar ao enunciado</button>
    </div>
    <textarea id="interviewer-yaml" style="width:100%; height:22rem; margin-top:0.5rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em" spellcheck="false"></textarea>
    <div class="row" style="margin-top:0.4rem">
      <button id="save-interviewer">Salvar</button>
      <span id="interviewer-msg" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <h3>Tokens de envio para alunos</h3>
    <div class="row">
      <input id="sub-label" placeholder="Nome do aluno (obrigatório)"/>
      <input id="sub-count" type="number" min="1" max="50" value="1" style="width:80px"/>
      <button id="create-subs">Gerar</button>
    </div>
    <div id="sub-msg" class="muted" style="margin-top:0.4rem"></div>
    <table id="sub-table" style="display:none">
      <thead><tr><th>Token de envio</th><th>Rótulo</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="sub-empty" class="muted" style="display:none">Nenhum token criado ainda.</div>
  </div>
</div>

<script>
const workToken = location.pathname.split('/').filter(Boolean)[1];

async function load() {
  const r = await fetch(`/w/${encodeURIComponent(workToken)}/info`);
  if (r.status === 404) {
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  if (!r.ok) {
    document.getElementById('notfound').textContent = 'Erro ao carregar.';
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  const j = await r.json();
  document.getElementById('main').style.display = 'block';
  document.getElementById('work-name').textContent = j.work.name;
  const enunciadoUrl = `/w/${encodeURIComponent(workToken)}/enunciado`;
  document.getElementById('enunciado-status').innerHTML = j.work.has_enunciado
    ? `Enunciado atual: <a href="${enunciadoUrl}" target="_blank">abrir PDF ↗</a>. Envie um novo arquivo para substituir.`
    : 'Nenhum enunciado enviado ainda.';
  document.getElementById('send-enunciado').textContent = j.work.has_enunciado ? 'Substituir' : 'Enviar PDF';
  document.getElementById('interviewer-status').textContent = j.work.has_interviewer
    ? 'Interviewer salvo. Edite e salve novamente para substituir.'
    : 'Nenhum interviewer salvo ainda.';
  const adaptBtn = document.getElementById('adapt-interviewer');
  adaptBtn.disabled = !j.work.has_enunciado;
  adaptBtn.title = j.work.has_enunciado
    ? 'Especializa o YAML para o enunciado deste trabalho'
    : 'Envie o enunciado antes de adaptar';

  const tbody = document.querySelector('#sub-table tbody');
  if (j.submissions.length === 0) {
    document.getElementById('sub-table').style.display = 'none';
    document.getElementById('sub-empty').style.display = 'block';
  } else {
    document.getElementById('sub-table').style.display = 'table';
    document.getElementById('sub-empty').style.display = 'none';
    tbody.innerHTML = j.submissions.map(s => {
      const url = '/s/' + encodeURIComponent(s.submission_token);
      return `<tr>
        <td>
          <div class="row">
            <code class="token">${escapeHtml(s.submission_token)}</code>
            <button class="icon-btn" title="Copiar token" onclick="copyToken(this, '${s.submission_token}')">📋</button>
            <a href="${url}" target="_blank" title="Abrir página do aluno">abrir ↗</a>
          </div>
        </td>
        <td>${escapeHtml(s.student_label || '—')}</td>
        <td><span class="badge">${s.status}</span></td>
      </tr>`;
    }).join('');
  }
}

document.getElementById('send-enunciado').onclick = async () => {
  const msg = document.getElementById('enunciado-msg');
  const f = document.getElementById('enunciado-file').files[0];
  msg.textContent = '';
  if (!f) { msg.textContent = 'Escolha um arquivo PDF.'; return; }
  const form = new FormData();
  form.append('file', f);
  msg.textContent = 'Enviando...';
  const r = await fetch(`/w/${encodeURIComponent(workToken)}/enunciado`, { method: 'POST', body: form });
  if (!r.ok) { msg.textContent = 'Falha no envio'; return; }
  msg.textContent = 'Enunciado salvo.';
  load();
};

// Interviewer
async function loadInterviewerTemplates() {
  const r = await fetch('/interviewers/templates');
  if (!r.ok) return;
  const j = await r.json();
  const sel = document.getElementById('tpl-select');
  sel.innerHTML = j.templates.map(t => `<option value="${encodeURIComponent(t.filename)}">${escapeHtml(t.filename)}</option>`).join('');
}

async function loadCurrentInterviewer() {
  const r = await fetch(`/w/${encodeURIComponent(workToken)}/interviewer`);
  if (!r.ok) return;
  const j = await r.json();
  if (j.yaml) document.getElementById('interviewer-yaml').value = j.yaml;
}

document.getElementById('load-tpl').onclick = async () => {
  const ta = document.getElementById('interviewer-yaml');
  const msg = document.getElementById('interviewer-msg');
  msg.textContent = '';
  if (ta.value.trim() && !confirm('Substituir o conteúdo atual pelo template?')) return;
  const filename = document.getElementById('tpl-select').value;
  const r = await fetch(`/interviewers/templates/${filename}`);
  if (!r.ok) { msg.textContent = 'Falha ao carregar template'; return; }
  ta.value = await r.text();
};

document.getElementById('adapt-interviewer').onclick = async () => {
  const ta = document.getElementById('interviewer-yaml');
  const msg = document.getElementById('interviewer-msg');
  const btn = document.getElementById('adapt-interviewer');
  msg.textContent = '';
  const content = ta.value.trim();
  if (!content) { msg.textContent = 'Carregue ou cole um YAML antes de adaptar.'; return; }
  if (!confirm('Substituir o conteúdo atual por uma versão adaptada ao enunciado? Isso pode levar 20–40s.')) return;
  btn.disabled = true;
  const prevText = btn.textContent;
  btn.textContent = 'Adaptando...';
  msg.textContent = 'Gerando YAML adaptado — aguarde.';
  try {
    const r = await fetch(`/w/${encodeURIComponent(workToken)}/interviewer/adapt`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ yaml: content })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (j.yaml) {
        ta.value = j.yaml;
        msg.textContent = 'Modelo retornou YAML inválido; revise manualmente.';
      } else {
        msg.textContent = 'Falha: ' + (j.error || 'ao adaptar');
      }
      return;
    }
    ta.value = j.yaml;
    msg.textContent = 'Adaptado. Revise e clique em Salvar.';
  } catch {
    msg.textContent = 'Falha na comunicação.';
  } finally {
    btn.disabled = false;
    btn.textContent = prevText;
  }
};

document.getElementById('save-interviewer').onclick = async () => {
  const msg = document.getElementById('interviewer-msg');
  msg.textContent = '';
  const content = document.getElementById('interviewer-yaml').value;
  if (!content.trim()) { msg.textContent = 'Nada para salvar.'; return; }
  const r = await fetch(`/w/${encodeURIComponent(workToken)}/interviewer`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ yaml: content })
  });
  const j = await r.json();
  if (!r.ok) { msg.textContent = 'Erro: ' + (j.detail || j.error || 'falha ao salvar'); return; }
  msg.textContent = 'Salvo.';
  document.getElementById('interviewer-status').textContent = 'Interviewer salvo. Edite e salve novamente para substituir.';
};

document.getElementById('create-subs').onclick = async () => {
  const msg = document.getElementById('sub-msg');
  const label = document.getElementById('sub-label').value.trim();
  const count = Number(document.getElementById('sub-count').value) || 1;
  msg.textContent = '';
  if (!label) { msg.textContent = 'Informe o nome do aluno.'; return; }
  const r = await fetch(`/w/${encodeURIComponent(workToken)}/submissions`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label, count })
  });
  const j = await r.json();
  if (!r.ok) { msg.textContent = 'Falha: ' + (j.error || 'ao gerar'); return; }
  msg.textContent = `${j.submissions.length} token(s) gerados.`;
  load();
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function copyToken(btn, token) {
  try { await navigator.clipboard.writeText(token); }
  catch { return; }
  const prev = btn.textContent;
  btn.textContent = '✓';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1500);
}

load();
loadInterviewerTemplates();
loadCurrentInterviewer();
</script>
</body>
</html>
