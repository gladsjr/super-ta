<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ORATIA — Ativar conta</title>
<link rel="stylesheet" href="/static/css/app.css"/>
<script src="/static/js/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/static/branding/favicon-32.png"/>
<style>
  .wrap { max-width: 420px; margin: var(--sp-10) auto 0; }
  .row { display: flex; flex-direction: column; gap: var(--sp-2); }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/"><img class="brand-mark" src="/static/branding/oratia-icon.png" alt=""><img class="brand-word" src="/static/branding/oratia-wordmark.png" alt="ORATIA"></a>
</header>

<main class="page">
  <div class="wrap">
    <div class="card">
      <h3 class="card-title">Ativar sua conta</h3>
      <p id="who" class="hint">Verificando convite…</p>
      <div id="form" class="row hidden">
        <input id="pass1" class="input" type="password" placeholder="escolha uma senha (mín. 6)" autocomplete="new-password"/>
        <input id="pass2" class="input" type="password" placeholder="repita a senha" autocomplete="new-password"/>
        <button id="go" class="btn btn-primary">Ativar conta</button>
      </div>
      <div id="msg" class="hint"></div>
      <div id="done" class="hidden">
        <p>✅ Conta ativada! Você já pode entrar.</p>
        <a class="btn btn-primary" href="/unidades">Ir para o login</a>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('token') || '';
const ERR = {
  invite_not_found: 'Convite não encontrado — confira o link.',
  invite_expirado: 'Este convite expirou. Peça um novo ao administrador.',
  invite_cancelado: 'Este convite foi substituído ou cancelado. Use o link mais recente ou peça um novo.',
  invite_ativado: 'Este convite já foi usado. Se foi você, é só entrar com sua senha.',
  invite_already_used: 'Este convite já foi usado.',
  password_too_short: 'A senha precisa de pelo menos 6 caracteres.',
};
async function boot() {
  if (!token) { $('who').textContent = 'Link inválido (sem token).'; return; }
  const r = await fetch('/api/ativar?token=' + encodeURIComponent(token));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('who').textContent = ERR[j.error] || 'Convite inválido.'; return; }
  $('who').textContent = `Convite para ${j.name} (${j.email}). Escolha sua senha:`;
  $('form').classList.remove('hidden');
}
$('go').onclick = async () => {
  const p1 = $('pass1').value, p2 = $('pass2').value;
  if (p1 !== p2) { $('msg').textContent = 'As senhas não conferem.'; return; }
  const r = await fetch('/api/ativar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: p1 }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('msg').textContent = ERR[j.error] || 'Falha ao ativar.'; return; }
  $('form').classList.add('hidden'); $('msg').textContent = ''; $('who').textContent = '';
  $('done').classList.remove('hidden');
};
boot();
</script>
</body>
</html>
