<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SuperTA — Aluno</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: system-ui; margin: 2rem auto; max-width: 720px; padding: 0 1rem; }
  h1 { margin-bottom: 0.2rem; }
  .muted { color: #666; font-size: 0.9em; }
  #chat { border: 1px solid #ccc; padding: 1rem; min-height: 200px; margin-top: 0.5rem; }
  #chat .ta-msg { margin: 0.5rem 0; line-height: 1.6; }
  #chat .ta-msg p { margin: 0.5em 0; }
  #chat .ta-msg code { background: #f4f4f4; padding: 0.2em 0.4em; border-radius: 3px; }
  #chat .ta-msg pre { background: #f4f4f4; padding: 1em; overflow-x: auto; }
  .katex-display { margin: 1em 0; overflow-x: auto; }
  .notice { padding: 0.75rem 1rem; border-radius: 6px; margin: 0.75rem 0; }
  .notice.err { background: #fde8e8; color: #8c1c1c; }
  .notice.ok { background: #e6f4ea; color: #1a662c; }
  input, button { padding: 0.4rem; font-size: 1em; }
  dialog.meta-dialog { max-width: 520px; border: 1px solid #ccc; border-radius: 10px; padding: 0; }
  dialog.meta-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  dialog.meta-dialog .dlg-body { padding: 1.1rem 1.3rem; }
  dialog.meta-dialog h3 { margin-top: 0; }
  dialog.meta-dialog .dlg-text { line-height: 1.5; white-space: pre-wrap; }
  dialog.meta-dialog .dlg-actions { margin-top: 1rem; text-align: right; border-top: 1px solid #eee; padding: 0.6rem 1.3rem; background: #fafafa; }
</style>
</head>
<body>

<div id="notfound" class="notice err" style="display:none">Token inválido ou trabalho não encontrado. Confira o link.</div>
<div id="finalized-notice" class="notice ok" style="display:none">
  Esta avaliação já foi finalizada. Veja o resultado abaixo.
</div>

<div id="main" style="display:none">
  <h1 id="work-name">—</h1>
  <div class="muted" id="meta"></div>

  <div id="upload-area" style="margin-top:1rem">
    <h3>Envio do trabalho</h3>
    <input type="file" id="file"/>
    <button id="sendFile">Enviar</button>
    <div id="fileRef" class="muted"></div>
  </div>

  <div id="chat-area" style="margin-top:1rem">
    <h3>Conversa</h3>
    <div id="chat"></div>
    <div style="margin-top:0.5rem; display:flex; gap:0.5rem">
      <input id="msg" placeholder="Sua resposta..." style="flex:1"/>
      <button id="send">Enviar</button>
    </div>
  </div>

  <div style="margin-top:1rem">
    <h3>Finalizar</h3>
    <button id="finalize">Gerar avaliação</button>
    <pre id="result"></pre>
  </div>
</div>

<dialog id="meta-dialog" class="meta-dialog">
  <div class="dlg-body">
    <h3>Esta pergunta é para o professor</h3>
    <div id="meta-dialog-text" class="dlg-text"></div>
  </div>
  <div class="dlg-actions">
    <button id="meta-dialog-close">Entendi</button>
  </div>
</dialog>

<script>
const submissionToken = location.pathname.split('/').filter(Boolean)[1];
let phase = 'awaiting_upload';
let finalized = false;
const chat = document.getElementById('chat');

function renderMessage(text) {
  let html = text;
  html = html.replace(/\\\[([\s\S]*?)\\\]/g, (m, f) => {
    try { return katex.renderToString(f.trim(), { displayMode: true, throwOnError: false }); } catch { return m; }
  });
  html = html.replace(/\\\(([\s\S]*?)\\\)/g, (m, f) => {
    try { return katex.renderToString(f.trim(), { displayMode: false, throwOnError: false }); } catch { return m; }
  });
  return marked.parse(html);
}
function appendTA(text) {
  const div = document.createElement('div');
  div.className = 'ta-msg';
  div.innerHTML = `<b>TA:</b> ${renderMessage(text)}`;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}
function appendUser(text) {
  const div = document.createElement('div');
  div.innerHTML = `<b>Você:</b> ${text}`;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  return div;
}
function showMetaDialog(text) {
  document.getElementById('meta-dialog-text').textContent = text;
  const dlg = document.getElementById('meta-dialog');
  if (typeof dlg.showModal === 'function') dlg.showModal();
  else alert(text);
}
document.getElementById('meta-dialog-close').onclick = () => {
  document.getElementById('meta-dialog').close();
};
function appendStatus(text, isError = false) {
  const div = document.createElement('div');
  div.style.color = isError ? 'red' : '#666';
  div.innerHTML = isError ? `<b>Erro:</b> ${text}` : `<em>${text}</em>`;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}

async function start() {
  const r = await fetch(`/s/${encodeURIComponent(submissionToken)}/start`, { method: 'POST' });
  if (r.status === 404) {
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  if (r.status === 403) {
    finalized = true;
    document.getElementById('finalized-notice').style.display = 'block';
    document.getElementById('main').style.display = 'block';
    document.getElementById('upload-area').style.display = 'none';
    document.getElementById('chat-area').style.display = 'none';
    return;
  }
  if (!r.ok) {
    document.getElementById('notfound').textContent = 'Erro ao iniciar. Tente novamente.';
    document.getElementById('notfound').style.display = 'block';
    return;
  }
  const j = await r.json();
  document.getElementById('main').style.display = 'block';
  document.getElementById('work-name').textContent = j.work.name;
  phase = j.session.currentPhase;

  // Render history (resume)
  for (const m of (j.session.chat || [])) {
    if (m.role === 'assistant') appendTA(m.content);
    else appendUser(m.content);
  }

  if (j.session.hasUpload) {
    document.getElementById('upload-area').style.display = 'none';
  }
}

document.getElementById('sendFile').onclick = async () => {
  const f = document.getElementById('file').files[0];
  if (!f) return alert('Escolha um arquivo.');
  const sendBtn = document.getElementById('sendFile');
  sendBtn.disabled = true;
  appendStatus('Enviando arquivo...');
  const form = new FormData();
  form.append('file', f);
  appendStatus('Analisando trabalho...');
  try {
    const r = await fetch(`/s/${encodeURIComponent(submissionToken)}/upload`, { method: 'POST', body: form });
    const j = await r.json();
    document.getElementById('fileRef').textContent = 'Arquivo enviado: ' + f.name;
    if (j.error) appendStatus(j.error, true);
    else if (j.assistant) {
      appendTA(j.assistant);
      document.getElementById('upload-area').style.display = 'none';
    }
  } catch {
    appendStatus('Falha na comunicação com o servidor', true);
  } finally {
    sendBtn.disabled = false;
  }
};

document.getElementById('send').onclick = async () => {
  const input = document.getElementById('msg');
  const m = input.value;
  if (!m) return;
  const userNode = appendUser(m);
  input.value = '';
  let r, j;
  try {
    r = await fetch(`/s/${encodeURIComponent(submissionToken)}/chat`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: m })
    });
    j = await r.json();
  } catch {
    appendStatus('Falha na comunicação com o servidor', true);
    return;
  }
  if (j.error) { appendStatus(j.error, true); return; }
  if (j.channel === 'modal') {
    // Meta intervention: remove the optimistic bubble, restore input, show modal.
    if (userNode && userNode.parentNode) userNode.parentNode.removeChild(userNode);
    input.value = j.restore_input ?? m;
    input.focus();
    showMetaDialog(j.assistant_response ?? '');
    return;
  }
  appendTA(j.assistant);
};

document.getElementById('msg').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('send').click(); }
});

document.getElementById('finalize').onclick = async () => {
  const btn = document.getElementById('finalize');
  btn.disabled = true;
  const r = await fetch(`/s/${encodeURIComponent(submissionToken)}/finalize`, { method: 'POST' });
  const j = await r.json();
  document.getElementById('result').textContent = JSON.stringify(j, null, 2);
  btn.disabled = false;
};

start();
</script>
</body>
</html>
