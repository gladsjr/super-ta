<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SuperTA — Admin</title>
<link rel="stylesheet" href="/static/css/app.css"/>
<style>
  .login-wrap { max-width: 380px; margin: var(--sp-10) auto 0; }
  .work-card { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-4) var(--sp-5); align-items: start; }
  .work-card h3 { margin: 0 0 var(--sp-2) 0; }
  .work-stats { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-1); }
  .work-token-block .label { margin-bottom: var(--sp-1); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">ST</span> SuperTA</a>
    <span class="topbar-context">Painel administrativo</span>
    <div class="topbar-right" id="user-area">
      <span id="user-info"></span>
      <button id="logout-btn" class="btn btn-sm">Sair</button>
    </div>
  </div>
</header>

<main class="page">

  <div id="login-screen" class="login-wrap hidden">
    <div class="card">
      <h2>Entrar</h2>
      <p class="muted">Use suas credenciais para acessar o painel.</p>
      <div class="field">
        <label class="label" for="login-user">Usuário</label>
        <input id="login-user" class="input" placeholder="usuário" autocomplete="username"/>
      </div>
      <div class="field">
        <label class="label" for="login-pass">Senha</label>
        <input id="login-pass" class="input" type="password" autocomplete="current-password"/>
      </div>
      <button id="login-btn" class="btn btn-primary" style="width:100%">Entrar</button>
      <div id="login-error" class="error-text"></div>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <div class="page-header">
      <h1>Trabalhos</h1>
      <div class="subtitle">Crie trabalhos e distribua os tokens para os professores responsáveis.</div>
    </div>

    <div class="card">
      <h3 class="card-title">Novo trabalho</h3>
      <div class="row">
        <input id="new-work-name" class="input" placeholder="Nome do trabalho (ex.: Prova 1)" style="flex:1; min-width: 260px"/>
        <button id="create-work" class="btn btn-primary">Criar</button>
      </div>
      <div id="create-msg" class="hint"></div>
    </div>

    <h3 style="margin-top: var(--sp-6)">Seus trabalhos</h3>
    <div id="works"></div>
  </div>

</main>

<script>
async function checkAuth() {
  try {
    const r = await fetch('/me');
    if (r.ok) { const j = await r.json(); showApp(j.user); loadWorks(); }
    else showLogin();
  } catch { showLogin(); }
}
function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('user-area').classList.add('hidden');
}
function showApp(user) {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('user-area').classList.remove('hidden');
  document.getElementById('user-info').textContent = user.username;
}

document.getElementById('login-btn').onclick = async () => {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!username || !password) return errEl.textContent = 'Informe usuário e senha';
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (r.ok) { const j = await r.json(); document.getElementById('login-pass').value = ''; showApp(j.user); loadWorks(); }
    else errEl.textContent = 'Usuário ou senha inválidos';
  } catch { errEl.textContent = 'Falha na comunicação'; }
};
document.getElementById('login-pass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});
document.getElementById('logout-btn').onclick = async () => {
  await fetch('/logout', { method: 'POST' });
  document.getElementById('works').innerHTML = '';
  showLogin();
};

document.getElementById('create-work').onclick = async () => {
  const name = document.getElementById('new-work-name').value.trim();
  const msg = document.getElementById('create-msg');
  msg.textContent = '';
  if (!name) { msg.textContent = 'Nome obrigatório'; return; }
  try {
    const r = await fetch('/admin/works', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    if (r.status === 401) return showLogin();
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { msg.textContent = 'Falha: ' + (j.error || 'ao criar'); return; }
    document.getElementById('new-work-name').value = '';
    msg.textContent = 'Trabalho criado.';
    loadWorks();
  } catch { msg.textContent = 'Falha na comunicação'; }
};

async function loadWorks() {
  const r = await fetch('/admin/works');
  if (r.status === 401) return showLogin();
  const j = await r.json();
  const el = document.getElementById('works');
  if (!j.works || j.works.length === 0) {
    el.innerHTML = '<div class="card"><div class="table-empty">Nenhum trabalho ainda. Crie o primeiro acima.</div></div>';
    return;
  }
  el.innerHTML = j.works.map(w => {
    const profUrl = '/w/' + encodeURIComponent(w.work_token);
    const pending = Number(w.pending || 0);
    const inprog = Number(w.in_progress || 0);
    const finalized = Number(w.finalized || 0);
    const enunBadge = w.assignment_pdf
      ? '<span class="badge badge-accent">enunciado ✓</span>'
      : '<span class="badge">sem enunciado</span>';
    return `
      <div class="card work-card">
        <div>
          <h3>${escapeHtml(w.name)}</h3>
          <div class="work-stats">
            <span class="badge badge-pending">${pending} pendente${pending === 1 ? '' : 's'}</span>
            <span class="badge badge-in_progress">${inprog} em andamento</span>
            <span class="badge badge-finalized">${finalized} finalizado${finalized === 1 ? '' : 's'}</span>
            ${enunBadge}
          </div>
        </div>
        <div class="work-token-block">
          <div class="label">Token de trabalho</div>
          <div class="row-tight">
            <code class="token-chip">${escapeHtml(w.work_token)}</code>
            <button class="icon-btn" title="Copiar token" onclick="copyToken(this, '${w.work_token}')">📋</button>
            <a class="btn btn-ghost btn-sm" href="${profUrl}" target="_blank" title="Abrir painel do professor">Abrir ↗</a>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function copyToken(btn, token) {
  try { await navigator.clipboard.writeText(token); }
  catch { return; }
  const prev = btn.textContent;
  btn.textContent = '✓';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1500);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

checkAuth();
</script>
</body>
</html>
