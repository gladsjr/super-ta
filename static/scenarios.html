<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ORATIA — Estúdio de cenários</title>
<link rel="stylesheet" href="/static/css/app.css"/>
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: var(--sp-4); }
  .head-row { display:flex; align-items:baseline; gap: var(--sp-3); flex-wrap:wrap; }
  .mock-tag { font-size: var(--fs-xs); color: var(--gold-700, #8a6d1a); background: var(--gold-100, #fbf1d6); border:1px solid var(--gold-300,#e6cf94); padding: 2px 8px; border-radius: 999px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-3); }
  .pcard, .scard { border:1px solid var(--ink-200); border-radius: var(--r-md,8px); padding: var(--sp-3); background: var(--bg-raised,#fff); display:flex; flex-direction:column; gap: var(--sp-2); }
  .pcard .pc-head { display:flex; align-items:center; gap: var(--sp-2); }
  .pc-icon { font-size: 1.6rem; }
  .pc-name { font-weight:600; }
  .pc-role { color: var(--ink-500); font-size: var(--fs-sm); }
  .chips { display:flex; flex-wrap:wrap; gap: 4px; }
  .chip { font-size: var(--fs-xs); background: var(--bg-muted,#f3f1ea); color: var(--ink-600); border-radius: 999px; padding: 2px 8px; }
  .card-actions { display:flex; gap: var(--sp-2); margin-top:auto; }
  .scard .s-parts { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .s-avatar { font-size:1.2rem; }
  .overlay { position:fixed; inset:0; background:rgba(20,18,12,.45); display:flex; align-items:flex-start; justify-content:center; padding: var(--sp-4); overflow:auto; z-index:50; }
  .overlay.hidden { display:none; }
  .modal { background: var(--bg-raised,#fff); border-radius: var(--r-md,10px); max-width: 720px; width:100%; padding: var(--sp-4); margin-top: var(--sp-4); }
  .modal h3 { margin: 0 0 var(--sp-3); }
  .field { margin-bottom: var(--sp-3); }
  .field > label { display:block; font-weight:600; font-size: var(--fs-sm); margin-bottom: 4px; }
  .field .hint { font-weight:400; color: var(--ink-500); }
  .part-row { display:flex; gap: var(--sp-2); align-items:center; margin-bottom: var(--sp-2); flex-wrap:wrap; }
  .part-row select { flex:1; min-width:140px; }
  /* Runner */
  .transcript { display:flex; flex-direction:column; gap: var(--sp-2); max-height: 52vh; overflow:auto; padding: var(--sp-2); background: var(--bg-muted,#f7f5ef); border-radius: var(--r-sm,6px); }
  .t-frame { font-size: var(--fs-sm); color: var(--ink-600); background: var(--bg-raised,#fff); border:1px dashed var(--ink-300); border-radius: var(--r-sm,6px); padding: var(--sp-2); white-space: pre-wrap; }
  .bubble { padding: var(--sp-2) var(--sp-3); border-radius: 12px; max-width: 85%; }
  .b-persona { background: var(--bg-raised,#fff); border:1px solid var(--ink-200); align-self:flex-start; }
  .b-student { background: var(--accent-100, #d8efe9); align-self:flex-end; }
  .b-aside { align-self:center; max-width: 92%; font-size: var(--fs-sm); font-style: italic; color: var(--ink-600); background: var(--gold-50,#fdf8ec); border:1px dashed var(--gold-300,#e6cf94); border-radius: 10px; }
  .b-name { font-size: var(--fs-xs); color: var(--ink-500); margin-bottom: 2px; }
  .runner-input { display:flex; gap: var(--sp-2); margin-top: var(--sp-3); }
  .runner-input textarea { flex:1; }
  .empty { color: var(--ink-500); padding: var(--sp-4); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <h1 style="margin:0">Estúdio de cenários</h1>
    <span class="mock-tag">protótipo · mock (sem custo)</span>
  </div>
  <p class="card-sub">Defina <strong>personas</strong> (personagens reutilizáveis) e monte <strong>cenários</strong> que as combinam — com objetivo, papéis, interação síncrona ou assíncrona e até personas conversando entre si. Teste tudo aqui mesmo, sem gastar tokens.</p>

  <div class="tabs" role="tablist">
    <button class="tab-btn is-active" data-tab="scenarios" role="tab">Cenários</button>
    <button class="tab-btn" data-tab="personas" role="tab">Personas</button>
  </div>

  <section id="tab-scenarios">
    <div class="row" style="margin-bottom: var(--sp-3)">
      <button class="btn btn-primary" id="new-scenario">+ Novo cenário</button>
    </div>
    <div class="grid" id="scenarios-grid"></div>
  </section>

  <section id="tab-personas" class="hidden">
    <div class="row" style="margin-bottom: var(--sp-3)">
      <button class="btn btn-primary" id="new-persona">+ Nova persona</button>
    </div>
    <div class="grid" id="personas-grid"></div>
  </section>
</div>

<div class="overlay hidden" id="persona-modal"><div class="modal" id="persona-modal-body"></div></div>
<div class="overlay hidden" id="scenario-modal"><div class="modal" id="scenario-modal-body"></div></div>
<div class="overlay hidden" id="runner-modal"><div class="modal" id="runner-modal-body" style="max-width:640px"></div></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let META = { objective_types: [], participant_roles: [], interaction_modes: [] };
let PERSONAS = [], SCENARIOS = [];

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? {'Content-Type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const objLabel = v => (META.objective_types.find(o => o.value === v)?.label) || v;
const roleLabel = v => (META.participant_roles.find(o => o.value === v)?.label) || v;
const personaById = id => PERSONAS.find(p => p.id === id);

async function loadAll() {
  META = await api('GET', '/scenarios/api/meta');
  PERSONAS = (await api('GET', '/scenarios/api/personas')).personas;
  SCENARIOS = (await api('GET', '/scenarios/api/scenarios')).scenarios;
  renderPersonas(); renderScenarios();
}

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('is-active', x === b));
  document.getElementById('tab-scenarios').classList.toggle('hidden', b.dataset.tab !== 'scenarios');
  document.getElementById('tab-personas').classList.toggle('hidden', b.dataset.tab !== 'personas');
});

// ---- Personas ----
function renderPersonas() {
  const el = document.getElementById('personas-grid');
  if (!PERSONAS.length) { el.innerHTML = '<div class="empty">Nenhuma persona ainda. Crie a primeira.</div>'; return; }
  el.innerHTML = PERSONAS.map(p => `
    <div class="pcard">
      <div class="pc-head"><span class="pc-icon">${esc(p.icon)}</span><div><div class="pc-name">${esc(p.name)}</div><div class="pc-role">${esc(p.role)}</div></div></div>
      ${p.tone ? `<div class="pc-role">${esc(p.tone)}</div>` : ''}
      ${(p.objectives||[]).length ? `<div class="chips">${p.objectives.slice(0,3).map(o => `<span class="chip">${esc(o)}</span>`).join('')}</div>` : ''}
      <div class="card-actions"><button class="btn btn-sm" data-edit="${p.id}">Editar</button><button class="btn btn-ghost btn-sm" data-del="${p.id}">Excluir</button></div>
    </div>`).join('');
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openPersonaForm(personaById(b.dataset.edit)));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delPersona(b.dataset.del));
}
function linesField(label, hint, val) {
  return `<div class="field"><label>${label} <span class="hint">${hint}</span></label><textarea class="textarea" rows="3" data-lines>${esc((val||[]).join('\n'))}</textarea></div>`;
}
function openPersonaForm(p) {
  p = p || {};
  document.getElementById('persona-modal-body').innerHTML = `
    <h3>${p.id ? 'Editar persona' : 'Nova persona'}</h3>
    <div class="row" style="gap:var(--sp-3)">
      <div class="field" style="width:90px"><label>Ícone</label><input class="input" id="pf-icon" value="${esc(p.icon||'🧑')}" maxlength="4"/></div>
      <div class="field" style="flex:1"><label>Nome</label><input class="input" id="pf-name" value="${esc(p.name||'')}" placeholder="Ex.: Dra. Helena"/></div>
    </div>
    <div class="field"><label>Papel <span class="hint">quem é, de uma frase</span></label><input class="input" id="pf-role" value="${esc(p.role||'')}" placeholder="Ex.: investidor anjo cético"/></div>
    <div class="field"><label>Tom / estilo <span class="hint">como fala</span></label><input class="input" id="pf-tone" value="${esc(p.tone||'')}" placeholder="Ex.: direto, foca em números e risco"/></div>
    <div id="pf-objectives">${linesField('Objetivos', 'um por linha — o que a persona quer descobrir', p.objectives)}</div>
    <div id="pf-concerns">${linesField('Preocupações', 'um por linha — o que a deixa desconfiada', p.concerns)}</div>
    <div class="field"><label>O que ela sabe <span class="hint">contexto/material a que tem acesso</span></label><textarea class="textarea" rows="2" id="pf-knowledge">${esc(p.knowledge||'')}</textarea></div>
    <div class="row"><button class="btn btn-primary" id="pf-save">Salvar persona</button><button class="btn" id="pf-cancel">Cancelar</button><span class="hint" id="pf-msg"></span></div>`;
  show('persona-modal', true);
  document.getElementById('pf-cancel').onclick = () => show('persona-modal', false);
  document.getElementById('pf-save').onclick = async () => {
    const lines = sel => document.querySelector(`#${sel} [data-lines]`).value.split('\n').map(s=>s.trim()).filter(Boolean);
    const body = {
      ...(p.id ? { id: p.id } : {}),
      icon: val('pf-icon'), name: val('pf-name'), role: val('pf-role'), tone: val('pf-tone'),
      objectives: lines('pf-objectives'), concerns: lines('pf-concerns'), knowledge: val('pf-knowledge'),
    };
    try { await api('POST', '/scenarios/api/personas', body); show('persona-modal', false); await loadAll(); }
    catch (e) { document.getElementById('pf-msg').textContent = e.message; }
  };
}
async function delPersona(id) {
  if (!confirm('Excluir esta persona?')) return;
  try { await api('DELETE', '/scenarios/api/personas/' + id); await loadAll(); }
  catch (e) { alert(e.message); }
}

// ---- Cenários ----
function renderScenarios() {
  const el = document.getElementById('scenarios-grid');
  if (!SCENARIOS.length) { el.innerHTML = '<div class="empty">Nenhum cenário ainda. Crie o primeiro.</div>'; return; }
  el.innerHTML = SCENARIOS.map(s => {
    const avatars = (s.participant_personas||[]).map(pp => `<span class="s-avatar" title="${esc(pp.persona?.name||'')} — ${esc(roleLabel(pp.role))}">${esc(pp.persona?.icon||'❓')}</span>`).join('');
    return `<div class="scard">
      <div class="row" style="justify-content:space-between"><span class="pc-name">${esc(s.name)}</span><span class="badge badge-accent">${esc(objLabel(s.objective_type))}</span></div>
      <div class="s-parts">${avatars}<span class="chip">${s.interaction_mode === 'sincrono' ? 'síncrono' : 'assíncrono'}</span>${s.persona_exchange ? '<span class="chip">personas conversam</span>' : ''}</div>
      ${s.context ? `<div class="pc-role" style="white-space:normal">${esc(s.context.slice(0,120))}${s.context.length>120?'…':''}</div>` : ''}
      <div class="card-actions"><button class="btn btn-primary btn-sm" data-run="${s.id}">Testar (mock)</button><button class="btn btn-sm" data-edit="${s.id}">Editar</button><button class="btn btn-ghost btn-sm" data-del="${s.id}">Excluir</button></div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-run]').forEach(b => b.onclick = () => openRunner(b.dataset.run));
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openScenarioForm(SCENARIOS.find(s=>s.id===b.dataset.edit)));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delScenario(b.dataset.del));
}
function partRow(part) {
  const opts = PERSONAS.map(p => `<option value="${p.id}" ${part && part.persona_id===p.id?'selected':''}>${esc(p.icon)} ${esc(p.name)}</option>`).join('');
  const roles = META.participant_roles.map(r => `<option value="${r.value}" ${part && part.role===r.value?'selected':''}>${esc(r.label)}</option>`).join('');
  return `<div class="part-row"><select class="select pr-persona">${opts}</select><select class="select pr-role">${roles}</select><button class="btn btn-ghost btn-sm pr-del" type="button">remover</button></div>`;
}
function openScenarioForm(s) {
  s = s || {};
  if (!PERSONAS.length) { alert('Crie ao menos uma persona antes de montar um cenário.'); return; }
  const objOpts = META.objective_types.map(o => `<option value="${o.value}" ${s.objective_type===o.value?'selected':''}>${esc(o.label)}</option>`).join('');
  const modeRadios = META.interaction_modes.map(m => `<label style="display:inline-flex;gap:6px;align-items:center;margin-right:var(--sp-3)"><input type="radio" name="sf-mode" value="${m.value}" ${(s.interaction_mode||'sincrono')===m.value?'checked':''}/> ${esc(m.label)}</label>`).join('');
  const parts = (s.participants && s.participants.length) ? s.participants : [{ persona_id: PERSONAS[0].id, role: 'questionamento' }];
  document.getElementById('scenario-modal-body').innerHTML = `
    <h3>${s.id ? 'Editar cenário' : 'Novo cenário'}</h3>
    <div class="field"><label>Nome</label><input class="input" id="sf-name" value="${esc(s.name||'')}" placeholder="Ex.: Pitch para investidores"/></div>
    <div class="field"><label>Objetivo</label><select class="select" id="sf-objective">${objOpts}</select></div>
    <div class="field"><label>Modo de interação</label><div>${modeRadios}</div></div>
    <div class="field"><label>Contexto <span class="hint">a situação do encontro</span></label><textarea class="textarea" rows="2" id="sf-context">${esc(s.context||'')}</textarea></div>
    <div class="field"><label>Tarefa do aluno <span class="hint">o que ele deve fazer</span></label><textarea class="textarea" rows="2" id="sf-task">${esc(s.student_task||'')}</textarea></div>
    <div class="field"><label>Participantes <span class="hint">personas e seus papéis neste cenário</span></label>
      <div id="sf-parts">${parts.map(partRow).join('')}</div>
      <button class="btn btn-sm" id="sf-add-part" type="button">+ adicionar participante</button>
    </div>
    <div class="field"><label>Quem abre</label><select class="select" id="sf-opener"></select></div>
    <label class="create-test" style="margin-bottom:var(--sp-3)"><input type="checkbox" id="sf-exchange" ${s.persona_exchange?'checked':''}/> Permitir que as personas <strong>conversem entre si</strong> sobre o aluno (precisa de 2+ personas)</label>
    <div class="row"><button class="btn btn-primary" id="sf-save">Salvar cenário</button><button class="btn" id="sf-cancel">Cancelar</button><span class="hint" id="sf-msg"></span></div>`;
  show('scenario-modal', true);
  const partsEl = document.getElementById('sf-parts');
  const refreshOpener = () => {
    const sel = document.getElementById('sf-opener');
    const chosen = [...partsEl.querySelectorAll('.pr-persona')].map(x => x.value);
    sel.innerHTML = chosen.map(id => { const p = personaById(id); return `<option value="${id}">${esc(p?.icon||'')} ${esc(p?.name||id)}</option>`; }).join('');
    if (s.opener_persona_id && chosen.includes(s.opener_persona_id)) sel.value = s.opener_persona_id;
  };
  partsEl.addEventListener('change', refreshOpener);
  partsEl.addEventListener('click', e => { if (e.target.classList.contains('pr-del')) { if (partsEl.children.length>1) e.target.closest('.part-row').remove(); refreshOpener(); } });
  document.getElementById('sf-add-part').onclick = () => { partsEl.insertAdjacentHTML('beforeend', partRow(null)); refreshOpener(); };
  document.getElementById('sf-cancel').onclick = () => show('scenario-modal', false);
  refreshOpener();
  document.getElementById('sf-save').onclick = async () => {
    const participants = [...partsEl.querySelectorAll('.part-row')].map(r => ({ persona_id: r.querySelector('.pr-persona').value, role: r.querySelector('.pr-role').value }));
    const body = {
      ...(s.id ? { id: s.id } : {}),
      name: val('sf-name'), objective_type: document.getElementById('sf-objective').value,
      interaction_mode: document.querySelector('input[name="sf-mode"]:checked')?.value || 'sincrono',
      context: val('sf-context'), student_task: val('sf-task'),
      participants, persona_exchange: document.getElementById('sf-exchange').checked,
      opener_persona_id: document.getElementById('sf-opener').value,
    };
    try { await api('POST', '/scenarios/api/scenarios', body); show('scenario-modal', false); await loadAll(); }
    catch (e) { document.getElementById('sf-msg').textContent = e.message; }
  };
}
async function delScenario(id) {
  if (!confirm('Excluir este cenário?')) return;
  try { await api('DELETE', '/scenarios/api/scenarios/' + id); await loadAll(); }
  catch (e) { alert(e.message); }
}

// ---- Runner (mock) ----
let RUN = null, RUN_ASYNC = false;
async function openRunner(scenarioId) {
  document.getElementById('runner-modal-body').innerHTML = `<h3>Testar cenário <span class="mock-tag">mock</span></h3><div class="transcript" id="rn-transcript"></div>
    <div class="runner-input"><textarea class="textarea" id="rn-input" rows="2" placeholder="Responda como o aluno…"></textarea><button class="btn btn-primary" id="rn-send">Enviar</button></div>
    <div class="row" style="margin-top:var(--sp-2)"><button class="btn btn-ghost btn-sm" id="rn-close">Fechar</button><span class="hint" id="rn-hint"></span></div>`;
  show('runner-modal', true);
  document.getElementById('rn-close').onclick = () => show('runner-modal', false);
  document.getElementById('rn-send').onclick = sendTurn;
  document.getElementById('rn-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTurn(); } });
  try {
    const j = await api('POST', `/scenarios/api/run/${scenarioId}/start`);
    RUN = j.run; RUN_ASYNC = j.scenario.interaction_mode === 'assincrono';
    document.getElementById('rn-hint').textContent = RUN_ASYNC ? 'Assíncrono: as personas “deixam” mensagens; responda quando quiser.' : 'Síncrono: conversa ao vivo.';
    renderTranscript(RUN.transcript);
  } catch (e) { document.getElementById('rn-transcript').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function bubbleHtml(t) {
  if (t.kind === 'frame') return `<div class="t-frame">${esc(t.text)}</div>`;
  if (t.kind === 'student') return `<div class="bubble b-student">${esc(t.text)}</div>`;
  if (t.kind === 'aside') return `<div class="bubble b-aside"><div class="b-name">${esc(t.name)} → ${esc(personaById(t.to)?.name || 'persona')} (aparte)</div>${esc(t.text)}</div>`;
  return `<div class="bubble b-persona"><div class="b-name">${esc(t.icon||'')} ${esc(t.name)}</div>${esc(t.text)}</div>`;
}
function renderTranscript(transcript) {
  const el = document.getElementById('rn-transcript');
  el.innerHTML = transcript.map(bubbleHtml).join('');
  el.scrollTop = el.scrollHeight;
}
async function sendTurn() {
  const inp = document.getElementById('rn-input');
  const text = inp.value.trim();
  if (!text || !RUN) return;
  inp.value = '';
  RUN.transcript.push({ kind: 'student', text });
  renderTranscript(RUN.transcript);
  try {
    const j = await api('POST', `/scenarios/api/run/${RUN.id}/turn`, { text });
    RUN = j.run; renderTranscript(RUN.transcript);
  } catch (e) { document.getElementById('rn-hint').textContent = e.message; }
}

// ---- helpers ----
function val(id) { return document.getElementById(id).value.trim(); }
function show(id, on) { document.getElementById(id).classList.toggle('hidden', !on); }
document.getElementById('new-persona').onclick = () => openPersonaForm(null);
document.getElementById('new-scenario').onclick = () => openScenarioForm(null);
[ 'persona-modal','scenario-modal','runner-modal' ].forEach(id => document.getElementById(id).addEventListener('click', e => { if (e.target.id === id) show(id, false); }));

loadAll().catch(e => { document.querySelector('.wrap').insertAdjacentHTML('beforeend', `<div class="empty">Falha ao carregar: ${esc(e.message)}</div>`); });
</script>
</body>
</html>
