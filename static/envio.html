<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SuperTA — Acessar envio</title>
<link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">ST</span> SuperTA</a>
    <div class="spacer"></div>
    <span class="topbar-right">Acesso do aluno</span>
  </div>
</header>

<main class="page-narrow">
  <div class="card">
    <h1>Acessar envio</h1>
    <p class="muted">Cole o token que você recebeu do seu professor. São 12 caracteres hexadecimais.</p>

    <form id="f" class="stack">
      <div class="field">
        <label class="label" for="t">Token de envio</label>
        <input id="t" class="input input-mono" placeholder="ex.: 674d2aa7a25b" autocomplete="off" autofocus/>
      </div>
      <div class="row">
        <button type="submit" class="btn btn-primary">Abrir</button>
        <div id="err" class="error-text"></div>
      </div>
    </form>
  </div>
</main>

<script>
const TOKEN_RE = /^[0-9a-f]{12}$/i;
document.getElementById('f').onsubmit = (e) => {
  e.preventDefault();
  const token = document.getElementById('t').value.trim().toLowerCase();
  const err = document.getElementById('err');
  if (!TOKEN_RE.test(token)) {
    err.textContent = 'Token inválido: deve ter 12 caracteres hexadecimais.';
    return;
  }
  location.href = '/s/' + encodeURIComponent(token);
};
</script>
</body>
</html>
