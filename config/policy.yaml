web_access: false
max_turns: 12
challenge_task: true

# Model configuration
models:
  principal_reasoning_model: "gpt-5.5"
  fast_model: "gpt-5.4-mini"
  # Audio (modo de interação áudio com o aluno; ver replit.md)
  stt_model: "gpt-4o-transcribe"
  tts_model: "gpt-4o-mini-tts"
  # Future context-specific models can be configured here
  # comprehension_evaluator_model: "gpt-5.3"
  # clarification_evaluator_model: "gpt-5.3"
  # map_builder_model: "gpt-5.4"

# Triage (runs after each student answer, before next question)
triage:
  intensity_threshold: 6   # winner fires only if max(intensity) >= threshold

# Pré-gate de inteligibilidade no modo áudio. Decisão "pedir repetição" é puro
# código sobre os logprobs do STT (lib/audioIntelligibility.js); o LLM
# (AudioIntelligibilityAgent) entra só para fraseiar a fala em personagem.
# Calibração: ajuste estes números depois de observar logs reais.
# Recalibrado em jun/2026 após observar over-triggering em entrevistas reais de
# áudio (gate disparando por 2 tokens incertos no meio de respostas fluentes de
# 100-300 tokens). Antes: T=-0.3 (~74%) / K=2. Os logs [AUDIO:Gate] registram o
# aggregate (mean/min/lowTokens) de TODO áudio — use-os para refinar.
audio_intelligibility:
  enabled: true
  low_logprob_threshold: -1.2      # token "inseguro": logprob abaixo disso (~prob < 30%). Antes -0.3 (~74%) flagava incerteza normal de fala fluente.
  min_consecutive_low_tokens: 3    # tamanho mínimo de um trecho ininteligível (antes 2): exige um trecho de fato embolado, não um par isolado de tokens incertos.
  min_utterance_tokens: 4          # piso: enunciados curtos (ok, sim, "Maria") não gateiam
  max_retries_before_give_up: 3    # na N-ésima vez do mesmo turno, vira a fala + Dica de desistência
