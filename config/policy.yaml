web_access: false
max_turns: 12
challenge_task: true

# Cache de prompt (modelos 5.6+). Contexto: diagnóstico jul/2026 — misses
# anômalos (cached=0 com prefixo estável) crescem com o gap entre turnos
# (3% a 20-40s → 47% a 2,5min → 35% em produção com aluno real). Causa
# aparente: lookup/roteamento do lado da OpenAI na forma real da requisição
# (conversation + file_search); bug report preparado. Vereditos dos A/Bs
# (pace 150s, mesmos 10 itens): original $1,05/47% miss; breakpoints
# $1,01/73% (REPROVADO); dedup $0,71/31% (VENCEDOR, qualidade validada por
# 2 juízes cegos); dedup+keepalive $0,85/37% (REPROVADO).
prompt_cache:
  # Breakpoint explícito no input do turno + ttl 30m. REPROVADO no A/B
  # (miss PIOROU 47%→73%). Mantido como infra de teste; não ligar em prod.
  # Só surte efeito em modelos 5.6+ (anteriores rejeitam o parâmetro).
  explicit_breakpoints: false
  # ttl "30m" SOZINHO (sem breakpoints): prompt_cache_options {ttl:"30m"} no
  # payload do orquestrador. Testava a hipótese eviction/opt-in do diagnóstico
  # do Replit. REPROVADO no braço E (24/jul): miss 52% vs 31% sem ttl — pedir
  # a retenção mínima documentada NÃO restaura os hits; a hipótese que resta é
  # lookup/roteamento na forma real da requisição (bug report à OpenAI).
  # Mantido como infra de teste; 5.6+ apenas.
  ttl_30m: false
  # Dedup dos blocos ESTÁVEIS do orquestrador (agenda + análise + plano): quando
  # ligado, eles vão nas `instructions` (por-requisição, NUNCA armazenadas na
  # Conversation) em vez do input de cada turno. Sem isso, com o parâmetro
  # `conversation`, o input de cada turno (com os ~7,7k tokens estáveis) é
  # apensado ao histórico — no turno 10, ~70k dos ~100k de input são CÓPIAS
  # redundantes. Com dedup: input por turno ~1k, histórico cresce só com o
  # diálogo + file_search; pico ~30-40k; compactação vira só válvula.
  # ADOTADO (24/jul/2026): A/B no harness de benchmark = −32% de custo
  # ($0,71 vs $1,05/entrevista no regime realista) E qualidade preservada/
  # melhor em avaliação CEGA por 2 juízes independentes (Claude: dedup 3-1-1;
  # ChatGPT Sol Pro: dedup 4-0-1, notas 4,8 vs 4,2). Desligar = reverter aqui.
  static_blocks_in_instructions: true
  # Keep-alive do cache entre turnos (0 = desligado): pinga a cada N segundos
  # repetindo as instructions da última chamada (sem `conversation`; cap 8
  # pings/gap). REPROVADO no A/B: os pings acertavam o próprio cache a 92%
  # mas NÃO reduziram o miss dos turnos reais (37% vs 31%) — a entrada estava
  # comprovadamente quente e a requisição real (com conversation+file_search)
  # ainda deu cached=0: evidência-chave do bug report à OpenAI. Mantido como
  # infra de teste; não ligar em prod. Ver lib/cacheKeepalive.js.
  keepalive_seconds: 0

# Model configuration
models:
  # RECOMENDADO (exp/terra-teto-duro-followup): gpt-5.6-terra é melhor entrevistador
  # que o 5.4 — veredito CEGO UNÂNIME de 3 juízes de famílias distintas (Codex/gpt-5.5,
  # Claude, Gemini) em transcripts-tetoduro/: N(terra) > M(5.4), forte em auditoria
  # numérica e em quebrar evasivas do aluno complacente. Custo +18% ($0,94 vs $0,80).
  # Teto duro de follow-up (routes/interview.js) fica como rede de segurança (dormente).
  principal_reasoning_model: "gpt-5.6-terra"
  # Esforço de raciocínio aplicado SEMPRE que o modelo principal é usado (todos os
  # agentes que o consomem). Injetado em lib/openaiClient.js. Valores válidos:
  # minimal | low | medium | high. Vazio/ausente = padrão do modelo.
  # "medium" adotado em jul/2026 (experimentos + guardrail de insistência): entrevista
  # de áudio −33% de custo e −31% de latência vs "high", qualidade igual-ou-melhor em
  # avaliação cega (2 rodadas) e notas equivalentes com juiz fixo (4,85 vs 4,93; como
  # avaliador, medium ≈ high: 4,89 vs 4,85). Voltar a "high" = reverter esta linha.
  # EXPERIMENTO (exp/terra-teto-duro-followup): terra:medium — melhor entrevistador
  # (a validar em leitura cega) a custo ~paridade e mais rápido que o high. O teto
  # duro do routes/interview.js fica como rede de segurança (dormente no medium).
  principal_reasoning_effort: "medium"
  fast_model: "gpt-5.4-mini"
  # Audio (modo de interação áudio com o aluno; ver replit.md)
  stt_model: "gpt-4o-transcribe"
  tts_model: "gpt-4o-mini-tts"
  # Realtime (fala-a-fala) — usado só pelo tipo de trabalho "prova oral".
  # gpt-realtime-2.1: geração 2.x (contexto 128k, melhor raciocínio e reconhecimento
  # alfanumérico), pensando na evolução da entrevista em tempo real. Trade conhecido:
  # soa com sotaque americano no português (regressão de voz da geração 2.x) — mitigar
  # escolhendo a voz por prova (cedar/marin/ballad/verse). O corte intermitente de
  # captação é coberto pela rede conversacional (examinador confirma quando a resposta
  # parece cortada, em buildExamInstructions). VAD segue semantic (tolera pausas de
  # raciocínio). Voltar ao original = "gpt-realtime-2025-08-28".
  realtime_model: "gpt-realtime-2.1"
  # Future context-specific models can be configured here
  # comprehension_evaluator_model: "gpt-5.3"
  # clarification_evaluator_model: "gpt-5.3"
  # map_builder_model: "gpt-5.4"

# Triage (runs after each student answer, before next question)
triage:
  intensity_threshold: 6   # winner fires only if max(intensity) >= threshold

# Pré-gate de inteligibilidade no modo áudio. Decisão "pedir repetição" é puro
# código sobre os logprobs do STT (lib/audioIntelligibility.js); o LLM
# (AudioIntelligibilityAgent) entra só para fraseiar a fala em personagem.
# Três desfechos por confiança do STT (conf = e^logprob), calibrados em jun/2026
# contra 51 áudios REAIS (Joaquim+Lucas+Bruno). NUNCA se descarta a fala: o áudio
# é arquivado e, no caso "repetir", a transcrição entra no contexto do orquestrador
# (o aluno não repete tudo). Desfechos:
#   seguir  — seu áudio está ok; segue normal.
#   avisar  — alguns trechos incertos; o entrevistador responde NORMAL + uma Dica
#             não-bloqueante destacando os trechos. Não regrava.
#   repetir — muita coisa ruim; pede repetição + Dica (mantendo o contexto).
# Nos 51 áudios reais: repetir=0, avisar=~6, seguir=resto (o gate antigo bloqueava ~40%).
audio_intelligibility:
  enabled: true
  warn_logprob_threshold: -0.69    # token "incerto": logprob < disso (~conf < 50%)
  warn_pct: 0.05                   # >=5% dos tokens incertos -> AVISAR (Dica, não bloqueia)
  repeat_logprob_threshold: -1.2   # token "ruim": logprob < disso (~conf < 30%)
  repeat_consecutive: 8            # run de >=8 tokens ruins consecutivos -> REPETIR (trecho sustentado de garble)
  repeat_pct: 0.35                 # rede de segurança: >=35% incertos -> REPETIR (bem acima do ~14% observado)
  min_utterance_tokens: 4          # enunciados curtos (ok, nome) não acionam nada
  max_retries_before_give_up: 3    # na N-ésima repetição do mesmo turno, vira give_up + Dica de desistência

# Camada ACÚSTICA do pré-gate (modo áudio). Sinais calculados NO NAVEGADOR a
# partir do PCM do microfone (DSP puro, sem custo, sem decode no servidor) e
# enviados como campos no upload; combinados por severidade-máxima com o gate de
# logprob acima (lib/acousticGate.js). Pega o "confidently-wrong" de música alta,
# que o logprob é cego por construção (o STT erra COM confiança). Cutpoints
# iniciais da calibração sintética FLEURS+GTZAN (jun/2026) — REFINAR com logs
# reais (os [AUDIO:Acoustic] registram os valores crus por turno).
acoustic:
  enabled: true
  snr_enabled: true
  snr_warn: 20       # energy-SNR (dB, p95-p15 da energia por frame) abaixo disso -> avisar
  snr_repeat: 12     # abaixo disso -> repetir (crasso: barulho ~no nível da fala)
  bak_enabled: false # DNSMOS-BAK (modelo local de 1 MB) — ainda não calculado no cliente; plugável
  bak_warn: 2.5      # background quality (1=barulhento .. 5=limpo) abaixo disso -> avisar
  bak_repeat: 1.6    # abaixo disso -> repetir
