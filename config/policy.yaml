web_access: false
max_turns: 12
challenge_task: true

# Model configuration
models:
  principal_reasoning_model: "gpt-5.4"
  # Esforço de raciocínio aplicado SEMPRE que o modelo principal é usado (todos os
  # agentes que o consomem). Injetado em lib/openaiClient.js. Valores válidos:
  # minimal | low | medium | high. Vazio/ausente = padrão do modelo.
  # gpt-5.4 em "high" substitui o gpt-5.5 (cognição suficiente p/ avaliação, custo menor).
  principal_reasoning_effort: "high"
  fast_model: "gpt-5.4-mini"
  # Audio (modo de interação áudio com o aluno; ver replit.md)
  stt_model: "gpt-4o-transcribe"
  tts_model: "gpt-4o-mini-tts"
  # Realtime (fala-a-fala) — usado só pelo tipo de trabalho "prova oral".
  # gpt-realtime-2025-08-28: a geração ORIGINAL (contexto 32k). Voz em português do
  # Brasil soa NATIVA. Fixado no snapshot (não no alias "gpt-realtime") p/ não
  # migrar sozinho para a linha "2.x" (128k), que soa com sotaque americano no
  # português (regressão de voz da geração nova; ver histórico de commits).
  # Trade: abre mão do reconhecimento alfanumérico melhor da 2.x — priorizamos a voz.
  realtime_model: "gpt-realtime-2025-08-28"
  # Future context-specific models can be configured here
  # comprehension_evaluator_model: "gpt-5.3"
  # clarification_evaluator_model: "gpt-5.3"
  # map_builder_model: "gpt-5.4"

# Triage (runs after each student answer, before next question)
triage:
  intensity_threshold: 6   # winner fires only if max(intensity) >= threshold

# Pré-gate de inteligibilidade no modo áudio. Decisão "pedir repetição" é puro
# código sobre os logprobs do STT (lib/audioIntelligibility.js); o LLM
# (AudioIntelligibilityAgent) entra só para fraseiar a fala em personagem.
# Três desfechos por confiança do STT (conf = e^logprob), calibrados em jun/2026
# contra 51 áudios REAIS (Joaquim+Lucas+Bruno). NUNCA se descarta a fala: o áudio
# é arquivado e, no caso "repetir", a transcrição entra no contexto do orquestrador
# (o aluno não repete tudo). Desfechos:
#   seguir  — seu áudio está ok; segue normal.
#   avisar  — alguns trechos incertos; o entrevistador responde NORMAL + uma Dica
#             não-bloqueante destacando os trechos. Não regrava.
#   repetir — muita coisa ruim; pede repetição + Dica (mantendo o contexto).
# Nos 51 áudios reais: repetir=0, avisar=~6, seguir=resto (o gate antigo bloqueava ~40%).
audio_intelligibility:
  enabled: true
  warn_logprob_threshold: -0.69    # token "incerto": logprob < disso (~conf < 50%)
  warn_pct: 0.05                   # >=5% dos tokens incertos -> AVISAR (Dica, não bloqueia)
  repeat_logprob_threshold: -1.2   # token "ruim": logprob < disso (~conf < 30%)
  repeat_consecutive: 8            # run de >=8 tokens ruins consecutivos -> REPETIR (trecho sustentado de garble)
  repeat_pct: 0.35                 # rede de segurança: >=35% incertos -> REPETIR (bem acima do ~14% observado)
  min_utterance_tokens: 4          # enunciados curtos (ok, nome) não acionam nada
  max_retries_before_give_up: 3    # na N-ésima repetição do mesmo turno, vira give_up + Dica de desistência

# Camada ACÚSTICA do pré-gate (modo áudio). Sinais calculados NO NAVEGADOR a
# partir do PCM do microfone (DSP puro, sem custo, sem decode no servidor) e
# enviados como campos no upload; combinados por severidade-máxima com o gate de
# logprob acima (lib/acousticGate.js). Pega o "confidently-wrong" de música alta,
# que o logprob é cego por construção (o STT erra COM confiança). Cutpoints
# iniciais da calibração sintética FLEURS+GTZAN (jun/2026) — REFINAR com logs
# reais (os [AUDIO:Acoustic] registram os valores crus por turno).
acoustic:
  enabled: true
  snr_enabled: true
  snr_warn: 20       # energy-SNR (dB, p95-p15 da energia por frame) abaixo disso -> avisar
  snr_repeat: 12     # abaixo disso -> repetir (crasso: barulho ~no nível da fala)
  bak_enabled: false # DNSMOS-BAK (modelo local de 1 MB) — ainda não calculado no cliente; plugável
  bak_warn: 2.5      # background quality (1=barulhento .. 5=limpo) abaixo disso -> avisar
  bak_repeat: 1.6    # abaixo disso -> repetir
