# Tabela de preços (USD) — fonte única de verdade para cálculo de custo de
# cada chamada LLM. Carregada uma vez no boot por lib/billing.js. Fail-fast
# se um modelo declarado em policy.yaml não tiver entrada aqui.
#
# Valores conservadores: quando a documentação diverge ou o desconto exato
# (ex.: cache hit) é ambíguo, escolhemos o lado que sobre-estima o custo,
# para que o orçamento estoure cedo demais em vez de tarde demais.
#
# Atualizar quando trocar de modelo ou quando a OpenAI mudar tabela.

# Orçamento default (USD) atribuído a cada work_token recém-criado pelo admin.
# Calibrado para cobrir ~3 entrevistas em modo áudio (mais caro que texto):
#   - MapBuilder (1 chamada com PDF anexado): ~$0.03
#   - 12 turnos × (Comprehension + Clarification + QuestionGen) ≈ $0.55
#   - Outros agentes (intro, scope, etc) eventuais: ~$0.10
#   - Final report: ~$0.06
#   - TTS (~12 min de fala do entrevistador): ~$0.18
#   - STT (~12 min de fala do aluno): ~$0.10
#   Total por entrevista em áudio: ~$1.00; texto: ~$0.75.
#   3 entrevistas em áudio: ~$3.00. Margem de segurança → 4.00.
default_work_budget_usd: 4.00

# ---------------------------------------------------------------------------
# Modelos de texto (Responses API). Custo = input_tokens não-cacheados ×
# input_per_mtok + cached_tokens × input_cached_per_mtok + cache_write_tokens ×
# cache_write_per_mtok + output_tokens × output_per_mtok, tudo dividido por
# 1.000.000. cache_write_per_mtok é usado só por modelos que cobram escrita em
# cache (família GPT-5.6+); ausente = 0.
#
# Observação sobre cached: a documentação oficial costuma definir cache hit
# como ~10% do preço de input padrão (cache hit barateia 90%).
#
# Antes adotávamos 50% (5x o real) como margem conservadora. Mas com a alta
# taxa de cache hit medida (~65% de TODO o input; 76% no orquestrador da
# entrevista), esses 5x deixaram de ser margem e viraram DISTORÇÃO: o medidor
# superfaturava ~28% e estourava o orçamento cedo demais (menos entrevistas por
# dólar). Corrigido para o preço oficial (~10% do input). Verificar contra a
# tabela da OpenAI ao trocar de modelo.
# ---------------------------------------------------------------------------
text:
  gpt-5.6-sol:
    input_per_mtok: 5.00
    input_cached_per_mtok: 0.50
    cache_write_per_mtok: 6.25
    output_per_mtok: 30.00
  gpt-5.6:
    input_per_mtok: 5.00
    input_cached_per_mtok: 0.50
    cache_write_per_mtok: 6.25
    output_per_mtok: 30.00
  # 30/07/2026: OpenAI cortou o preço do terra em 20% (anúncio "advancing the
  # price-performance frontier"): input 2,50→2,00, output 15→12. Cached (10% do
  # input) e cache write (1,25× input) seguem as mesmas razões de sempre.
  # Conferir na reconciliação com a Costs API (fecha ~24h após o uso).
  gpt-5.6-terra:
    input_per_mtok: 2.00
    input_cached_per_mtok: 0.20
    cache_write_per_mtok: 2.50
    output_per_mtok: 12.00
  gpt-5.6-luna:
    input_per_mtok: 1.00
    input_cached_per_mtok: 0.10
    cache_write_per_mtok: 1.25
    output_per_mtok: 6.00
  gpt-5.4:
    input_per_mtok: 2.50
    input_cached_per_mtok: 0.25   # ~10% do input (oficial)
    output_per_mtok: 15.00
  gpt-5.5:
    input_per_mtok: 5.00
    input_cached_per_mtok: 0.50   # ~10% do input (oficial Standard)
    output_per_mtok: 30.00
  gpt-5.4-mini:
    input_per_mtok: 0.75
    input_cached_per_mtok: 0.075  # ~10% do input (oficial)
    output_per_mtok: 4.50

# ---------------------------------------------------------------------------
# STT (audio.transcriptions). gpt-4o-transcribe usa pricing por token. A API
# pode retornar `usage.type === 'tokens'` ou `'duration'`; tratamos os dois
# casos.
# - tokens:   cost = input_tokens × input_per_mtok + output_tokens × output_per_mtok
# - duration: cost = seconds × per_second_usd  (fallback estimado)
# ---------------------------------------------------------------------------
stt:
  # gpt-transcribe (jul/2026): preço oficial é POR MINUTO de áudio ($0.0045/min),
  # sem preço por token publicado — a API cobra por duração. Se algum dia o
  # usage vier como 'tokens', computeSttCost falha explícito (sem preço/mtok).
  gpt-transcribe:
    per_second_usd: 0.000075   # $0.0045/min ÷ 60
  gpt-4o-transcribe:
    input_per_mtok: 2.50
    output_per_mtok: 10.00
    per_second_usd: 0.006   # ~$0.36/min — usado se a API só devolver duration

# ---------------------------------------------------------------------------
# TTS (audio.speech). A API NÃO retorna usage; cobramos por caractere de
# input. Conversão: ~$0.015/min de fala ≈ ~750 chars/min ≈ $20/M chars.
# Conservador: $25/M chars.
# ---------------------------------------------------------------------------
tts:
  gpt-4o-mini-tts:
    text_per_mchar: 25.00

# ---------------------------------------------------------------------------
# Realtime (fala-a-fala, prova oral). Custo por token, separado por MODALIDADE
# (áudio é muito mais caro que texto) e direção (input/output), com input
# cacheado à parte. O `usage` de cada response.done traz esse desdobramento.
#
# Fonte: tabela oficial da OpenAI (developers.openai.com/api/docs/pricing),
# consultada em jun/2026. `gpt-realtime` é alias do snapshot `gpt-realtime-2`
# (text in $4 / cache $0,40 / out $24; audio in $32 / cache $0,40 / out $64).
# Reconferir ao trocar de snapshot.
# ---------------------------------------------------------------------------
realtime:
  gpt-realtime: &realtime_gpt_rates
    text_input_per_mtok: 4.00
    text_output_per_mtok: 24.00
    audio_input_per_mtok: 32.00
    audio_output_per_mtok: 64.00
    cached_per_mtok: 0.40         # input cacheado (áudio e texto ambos a 0,40)
  # gpt-realtime-2.1 (atual em policy.yaml) e o snapshot datado têm a MESMA
  # tabela do gpt-realtime — conferido na pricing page da OpenAI (jul/2026).
  # Alias YAML aponta para o mesmo bloco: um preço só, sem risco de divergir.
  gpt-realtime-2.1: *realtime_gpt_rates
  gpt-realtime-2025-08-28: *realtime_gpt_rates
