benchmark: ORATIA-Bench
setup_version: S0
context_version: C0
jury_version: J0
mode: frozen-turn
random_seed: 20260711
rag:
  strategy: lexical-v1
  chunk_chars: 1800
  top_k: 8
prompts:
  student: >-
    Preserve fielmente o nivel de dominio, a seguranca, as lacunas e o comportamento
    definidos para o aluno neste estado. Nao antecipe conhecimentos ausentes.
  candidate: >-
    Escolha a acao do superorquestrador que melhor revele dominio, coerencia e
    capacidade de decisao do aluno. Considere ask, follow_up, meta_modal, hint,
    finalize e ask_repeat; mantenha um unico foco e respeite a persona.
  judge: >-
    Compare decisao, fala, coerencia entre ambas, memoria, contexto, persona e
    respondibilidade oral. Nao favoreca a referencia apenas por ser a referencia.
cases_dir: bench/cases
case_ids: []
candidates:
  - openai:gpt-5.6-sol:high
judges:
  - openai:gpt-5.6-sol:max
model_catalog:
  - spec: openai:gpt-5.6-sol:low
    label: OpenAI GPT-5.6 Sol low
    roles: [candidate]
  - spec: openai:gpt-5.6-sol:medium
    label: OpenAI GPT-5.6 Sol medium
    roles: [candidate, judge, setup]
  - spec: openai:gpt-5.6-sol:high
    label: OpenAI GPT-5.6 Sol high
    roles: [candidate, judge, setup]
  - spec: openai:gpt-5.6-sol:xhigh
    label: OpenAI GPT-5.6 Sol xhigh
    roles: [judge, setup]
  - spec: openai:gpt-5.6-sol:max
    label: OpenAI GPT-5.6 Sol max
    roles: [judge, setup]
  - spec: anthropic:claude-fable-5:low
    label: Anthropic Claude Fable 5 low
    roles: [candidate]
  - spec: anthropic:claude-fable-5:medium
    label: Anthropic Claude Fable 5 medium
    roles: [candidate, judge, setup]
  - spec: anthropic:claude-fable-5:high
    label: Anthropic Claude Fable 5 high
    roles: [candidate, judge, setup]
  - spec: anthropic:claude-fable-5:xhigh
    label: Anthropic Claude Fable 5 xhigh
    roles: [judge, setup]
  - spec: anthropic:claude-fable-5:max
    label: Anthropic Claude Fable 5 max
    roles: [judge, setup]
  - spec: xai:grok-4.5:low
    label: xAI Grok 4.5 low
    roles: [candidate]
  - spec: xai:grok-4.5:medium
    label: xAI Grok 4.5 medium
    roles: [candidate, judge, setup]
  - spec: xai:grok-4.5:high
    label: xAI Grok 4.5 high
    roles: [candidate, judge, setup]
  - spec: gemini:gemini-3.1-pro-preview:low
    label: Google Gemini 3.1 Pro Preview low
    roles: [candidate]
  - spec: gemini:gemini-3.1-pro-preview:medium
    label: Google Gemini 3.1 Pro Preview medium
    roles: [candidate, judge, setup]
  - spec: gemini:gemini-3.1-pro-preview:high
    label: Google Gemini 3.1 Pro Preview high
    roles: [candidate, judge, setup]
model_catalog_pending:
  - spec: meta:muse-spark-1.1:xhigh
    label: Meta Muse Spark 1.1 xhigh
    roles: [candidate, judge, setup]
    reason: Meta Model API esta em preview publico, mas o ORATIA Bench ainda nao tem adaptador Meta.
storage:
  runs_dir: bench/runs
limits:
  max_cost_usd: 50
  # Unidades (caso×turno×candidato na execução; casos na geração) em voo ao
  # mesmo tempo. O gargalo é a chamada dos modelos; 4 vias ~4x mais rápido.
  max_concurrency: 4
  timeout_ms: 90000
  retries: 2
  latency_repetitions: 1
consensus:
  disagreement_threshold: 0.65
  deliberation_enabled: false
providers:
  anthropic:
    pricing: {}
  gemini:
    pricing: {}
